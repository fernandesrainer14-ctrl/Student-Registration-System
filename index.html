<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Student Registration System</h1>
        <p>Welcome to the Student Registration System. Please follow the registration guidelines.</p>
    </header>

     <div class="container">

      <div class="form-card">

        <p class="subtitle">Please fill in the details below to register as a new student.</p>

       <form>

        <div class="form-group">
             <label for="student-name">Student Name</label>
             <input
             type="text"
             id="studentName"
             name="studentName"
             placeholder="Enter your full name"
             required 
             >
        </div>

    <div class="form-group">
        <label for="studentId">Student ID</label>
        <input 
        type="text"
        id="studentId"
        name="studentId"
        placeholder="Enter your Student ID"
        required
        >
    </div>

    <div class="form-group">
        <label for="email">Email ID</label>
        <input
        type="email"
        id="email"
        name="email"
        placeholder="example@gmail.com"
        required
        >
    </div>

    <div class="form-group">
        <label for="contact">Contact Number</label>
        <input
        type="tel"
        id="contact"
        name="contact"
        placeholder="Enter your Contact Number"
        required
        >
    </div>

        <button type="submit" class="button">Register Now</button>
    </div>
      </form>

     </div>

    </div>

</body>
</html>
